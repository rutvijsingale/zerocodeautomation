[pytest]
minversion = 8.0
testpaths = tests
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --maxfail=20
    --timeout=120
    --reruns=2
    --reruns-delay=2
    --alluredir=reports/allure-results
    -p no:cacheprovider

markers =
    smoke: critical happy paths, must pass on every commit
    regression: full regression sweep
    ui: Playwright UI tests
    api: pure API tests (requests + schema)
    contract: Pact consumer/provider verification
    accessibility: axe-core a11y scans (WCAG 2.1 AA)
    visual: Playwright snapshot / pixel-diff
    security: rate limit, CORS, input validation, headers
    performance: k6 trigger sanity (full perf in perf/)
    positive: happy-path variant
    negative: invalid-input variant
    edge: boundary / unusual variant
    flaky_quarantine: known flaky, skipped from blocking lanes
    websocket: tests that open a real WebSocket to /api/recording/:id
    requires_mvn: tests that require Apache Maven on PATH
    requires_npm: tests that require npm on PATH

    project_management: ZAC module - project CRUD
    step_builder:       ZAC module - Gherkin/step linkage validation
    code_export:        ZAC module - export to playwright-ts/java/selenium
    test_runner:        ZAC module - rerun + test-runner endpoints
    locators:           ZAC module - locator repository
    reusable_flows:     ZAC module - per-project reusable flows
    test_data:          ZAC module - data sets / Examples
    environments:       ZAC module - env CRUD
    requirements_parser:ZAC module - SRS upload + parsing
    test_case_generator:ZAC module - generate test cases from steps
    append_steps:       ZAC module - incremental step append + file gen
    maven_runner:       ZAC module - Maven probe + execute
    npm_runner:         ZAC module - npm probe + execute
    storage:            ZAC module - storage stats
    recording_session:  ZAC module - recording lifecycle (UI+REST+WS)
    browser_selection:  ZAC module - browser switcher
    recording_assertions:ZAC module - assertion capture
    docs_viewer:        ZAC module - markdown docs serving
    domain_models:      ZAC module - JS domain model invariants
    scenario_outline:   ZAC module - Examples table generation
    lifecycle:          ZAC module - graceful shutdown / cleanup

asyncio_mode = auto
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s :: %(message)s
log_cli_date_format = %Y-%m-%dT%H:%M:%S
