suite: docs_viewer
version: 1
settings:
  enabled: true
  promote_after_heals: 3
  fail_on_no_strategy: true
  report_dir: reports/healer
  attach_to_allure: true

strategy_priority: [testid, id, role, label, text, css, xpath]

locators:
  - name: docs_container
    primary: { testid: docs-container }
    fallbacks: [{ css: ".container" }]
  - name: docs_heading
    primary: { role: heading }
    fallbacks: [{ css: ".container h1" }]
