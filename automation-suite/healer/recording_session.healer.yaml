suite: recording_session
version: 1
settings:
  enabled: true
  promote_after_heals: 3
  fail_on_no_strategy: true
  report_dir: reports/healer
  attach_to_allure: true

strategy_priority: [testid, id, role, label, text, css, xpath]

locators:
  - name: base_url_input
    primary: { testid: baseUrl }
    fallbacks: [{ id: baseUrl }, { label: "Base URL" }]
  - name: feature_title_input
    primary: { testid: featureTitle }
    fallbacks: [{ id: featureTitle }, { label: "Feature Title" }]
  - name: project_name_input
    primary: { testid: projectName }
    fallbacks: [{ id: projectName }]
  - name: browser_type_select
    primary: { testid: browserType }
    fallbacks: [{ id: browserType }, { role: combobox }]
  - name: start_recording
    primary: { testid: startRecording }
    fallbacks: [{ id: startRecording }, { role: button, name: "Start Recording" }, { text: "Start Recording" }]
  - name: stop_recording
    primary: { testid: stopRecording }
    fallbacks: [{ id: stopRecording }, { text: "Stop Recording" }]
  - name: pause_recording
    primary: { testid: pauseRecording }
    fallbacks: [{ id: pauseRecording }]
  - name: recording_status
    primary: { testid: recordingStatus }
    fallbacks: [{ id: recordingStatus }]
  - name: recording_overlay
    primary: { testid: recordingOverlay }
    fallbacks: [{ id: recordingOverlay }]
  - name: overlay_stop
    primary: { testid: stopRecordingOverlay }
    fallbacks: [{ id: stopRecordingOverlay }, { role: button, name: "Stop Recording" }]
  - name: overlay_pause
    primary: { testid: pauseRecordingOverlay }
    fallbacks: [{ id: pauseRecordingOverlay }]
  - name: live_feature_overlay
    primary: { testid: code-feature-overlay }
    fallbacks: [{ id: code-feature-overlay }, { css: "textarea#code-feature-overlay" }]
  - name: live_steps_overlay
    primary: { testid: code-steps-overlay }
    fallbacks: [{ id: code-steps-overlay }, { css: "textarea#code-steps-overlay" }]
