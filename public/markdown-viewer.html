<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      line-height: 1.7;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #161b22;
      border-radius: 12px;
      padding: 40px;
      border: 1px solid rgba(48, 54, 61, 0.5);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    
    h1 {
      color: #58a6ff;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(88, 166, 255, 0.3);
    }
    
    h2 {
      color: #79c0ff;
      margin-top: 40px;
      margin-bottom: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(48, 54, 61, 0.5);
    }
    
    h3 {
      color: #a5d6ff;
      margin-top: 30px;
      margin-bottom: 15px;
    }
    
    h4 {
      color: #b1d9ff;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    
    p {
      margin-bottom: 15px;
      color: #c9d1d9;
    }
    
    ul, ol {
      margin-left: 30px;
      margin-bottom: 20px;
      color: #c9d1d9;
    }
    
    li {
      margin-bottom: 8px;
    }
    
    code {
      background: rgba(110, 118, 129, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-size: 0.9em;
      color: #f0883e;
    }
    
    pre {
      background: #0d1117;
      border: 1px solid rgba(48, 54, 61, 0.5);
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      margin: 20px 0;
    }
    
    pre code {
      background: none;
      padding: 0;
      color: #c9d1d9;
      font-size: 0.9em;
    }
    
    blockquote {
      border-left: 4px solid #58a6ff;
      padding-left: 20px;
      margin: 20px 0;
      color: #8b949e;
      font-style: italic;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    
    th, td {
      border: 1px solid rgba(48, 54, 61, 0.5);
      padding: 12px;
      text-align: left;
    }
    
    th {
      background: rgba(88, 166, 255, 0.1);
      color: #58a6ff;
      font-weight: 600;
    }
    
    td {
      color: #c9d1d9;
    }
    
    a {
      color: #58a6ff;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    a:hover {
      color: #79c0ff;
      text-decoration: underline;
    }
    
    hr {
      border: none;
      border-top: 1px solid rgba(48, 54, 61, 0.5);
      margin: 30px 0;
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid rgba(88, 166, 255, 0.3);
      border-radius: 8px;
      color: #58a6ff;
      text-decoration: none;
      transition: all 0.3s;
    }
    
    .back-link:hover {
      background: rgba(88, 166, 255, 0.2);
      transform: translateX(-3px);
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
    
    .error {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: 8px;
      padding: 20px;
      color: #f85149;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to IDE</a>
    <div id="content">
      <div class="loading">Loading documentation...</div>
    </div>
  </div>

  <script src="/markdown-viewer.js?v=2026-05-10-csp"></script>
</body>
</html>
